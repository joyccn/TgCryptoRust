name: Publish to PyPI

# Keep trusted publishing in this top-level workflow: PyPI does not support
# OIDC publishing from inside a reusable workflow. Release builds are reused.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and publish GitHub assets without publishing to PyPI
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, Test and Build Release
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  publish:
    name: Publish Verified Distributions to PyPI
    needs: release
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/TgCryptoRust/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Tested Distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dist-*
          path: dist
          merge-multiple: true

      - name: Download Recorded Checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: checksums

      - name: Verify Checksums and Existing PyPI Files Before Publishing
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import urlopen

          records = Path("checksums/SHA256SUMS").read_text().splitlines()
          expected = {line.split("  ", 1)[1]: line.split("  ", 1)[0] for line in records}
          files = {p.name: p for p in Path("dist").glob("*")}
          if len(expected) != 31 or files.keys() != expected.keys():
              raise SystemExit("Distribution set differs from the tested release")
          for name, path in files.items():
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected[name]:
                  raise SystemExit(f"Checksum mismatch for {name}")
          version = quote(os.environ["RELEASE_VERSION"], safe="")
          try:
              with urlopen(f"https://pypi.org/pypi/TgCryptoRust/{version}/json", timeout=30) as response:
                  published = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = {"urls": []}
          for artifact in published["urls"]:
              name = artifact["filename"]
              if name not in expected:
                  raise SystemExit(f"Existing PyPI distribution is outside this release: {name}")
              if artifact["digests"]["sha256"] != expected[name]:
                  raise SystemExit(f"Existing PyPI distribution has different bytes: {name}")
          print("Verified all 31 release distributions and existing PyPI files")
          PYTHON

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
