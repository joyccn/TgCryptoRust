[package]
name = "tgcryptors-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for TgCryptoRust — high-performance Telegram cryptography"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
tgcryptors-core = { path = "../tgcryptors-core" }
pyo3 = { version = "0.29.0", features = ["extension-module", "generate-import-lib"] }
