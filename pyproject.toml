[build-system]
requires = ["maturin>=1.13.3"]
build-backend = "maturin"

[project]
name = "TgCryptoRS"
version = "1.1.2"
description = "Rust-powered drop-in replacement for TgCrypto"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "LGPL-3.0-or-later"
keywords = [
    "kurigram",
    "telegram",
    "crypto",
    "cryptography",
    "encryption",
    "mtproto",
    "aes",
    "rust",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/joyccn/TgCryptoRS"
Source = "https://github.com/joyccn/TgCryptoRS"

[tool.maturin]
manifest-path = "tgcryptors-python/Cargo.toml"
module-name = "tgcryptors._native"
python-source = "python"
features = ["pyo3/extension-module", "pyo3/generate-import-lib"]
include = [
    { path = "COPYING", format = "sdist" },
    { path = "COPYING.lesser", format = "sdist" },
    { path = "python/tgcrypto/__init__.py", format = "wheel" },
    { path = "python/tgcryptors/__init__.py", format = "wheel" },
]
