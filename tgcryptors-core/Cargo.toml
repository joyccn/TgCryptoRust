[package]
name = "tgcryptors-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "High-performance Telegram cryptography library in Rust"

[features]
default = ["aesni"]
## Compatibility flag; RustCrypto selects hardware acceleration at runtime.
aesni = []
## Compatibility flag; ARM AES acceleration is selected automatically.
neon = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "benchmark"
harness = false

[dependencies]
rayon = "1.12.0"
zeroize = "1.9.1"
aes = { version = "0.9.3", features = ["zeroize"] }
