[package]
name = "tgcryptors-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for TgCryptoRust — high-performance Telegram cryptography"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
tgcryptors-core = { path = "../tgcryptors-core" }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
