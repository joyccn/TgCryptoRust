name: Release

# Complete releases start in pypi.yml. Manual runs here publish GitHub assets only.
on:
  workflow_call:
    outputs:
      version:
        description: Verified package version
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: Verified release tag
        value: ${{ jobs.prepare.outputs.tag }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Verify Version and Release Commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Version Parser
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Verify Manifest Versions and Tag
        id: version
        run: |
          python - <<'PYTHON'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          def load(path):
              return tomllib.loads(Path(path).read_text())

          version = load("pyproject.toml")["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Release version must be a valid SemVer version")
          if load("Cargo.toml")["workspace"]["package"]["version"] != version:
              raise SystemExit("Python and Rust workspace versions differ")
          for manifest in ("tgcryptors-core/Cargo.toml", "tgcryptors-python/Cargo.toml"):
              declared = load(manifest)["package"]["version"]
              if declared != {"workspace": True} and declared != version:
                  raise SystemExit(f"Version mismatch in {manifest}")
          for lockfile, names in (
              ("Cargo.lock", {"tgcryptors-core", "tgcryptors-python"}),
              ("uv.lock", {"tgcryptorust"}),
          ):
              packages = {p["name"]: p["version"] for p in load(lockfile)["package"]}
              if any(packages.get(name) != version for name in names):
                  raise SystemExit(f"Version mismatch in {lockfile}")

          tag = f"v{version}"
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Pushed tag does not match the package version")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", commit, "refs/remotes/origin/master"],
              check=False,
          )
          if ancestor.returncode != 0:
              raise SystemExit("Release commit must be contained in origin/master")
          existing = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
              capture_output=True, text=True,
          )
          if existing.returncode == 0 and existing.stdout.strip() != commit:
              raise SystemExit("Existing release tag points to another commit; tags are immutable")
          if existing.returncode not in (0, 128):
              raise SystemExit("Cannot verify existing release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in {
                  "version": version, "tag": tag, "commit": commit,
                  "prerelease": str("-" in version).lower(),
              }.items():
                  print(f"{key}={value}", file=output)
          print(f"Verified {tag} at {commit}")
          PYTHON

  checks:
    name: All CI Checks
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-wheels:
    name: Wheel (${{ matrix.os }} / Python ${{ matrix.python }})
    needs: [prepare, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Verified Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build Wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: "1.16.0"
          rust-toolchain: stable
          args: --release --locked --out dist --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
          sccache: "true"
          manylinux: auto

      - name: Install Wheel and Test Public API
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python - <<'PYTHON'
          from pathlib import Path
          import tgcrypto
          import tgcryptors
          for package in (tgcrypto, tgcryptors):
              package_dir = Path(package.__file__).parent
              assert (package_dir / "__init__.pyi").is_file(), package.__name__
              assert (package_dir / "py.typed").is_file(), package.__name__
          assert (Path(tgcryptors.__file__).parent / "_native.pyi").is_file()
          data = b"TgCryptoRust release wheel smoke test"
          key, iv = bytes(range(32)), bytes(range(16))
          encrypted = tgcryptors.ctr256_encrypt(data, key, iv, b"\x00")
          assert tgcrypto.ctr256_decrypt(encrypted, key, iv, b"\x00") == data
          assert tgcrypto.__version__ == tgcryptors.__version__
          assert tgcrypto.runtime_info()["implementation"] == "rust"
          print(f"Verified release wheel {tgcryptors.__version__}")
          PYTHON
          python -m unittest discover -s tests -v

      - name: Upload Verified Wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-linux-arm:
    name: Wheel (Linux ${{ matrix.target }} / Python ${{ matrix.python }})
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Verified Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Build ARM Wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          command: build
          maturin-version: "1.16.0"
          rust-toolchain: stable
          args: --release --locked --out dist --interpreter python${{ matrix.python }}
          sccache: "true"
          manylinux: auto

      - name: Upload ARM Wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-linux-${{ matrix.target }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    name: Source Distribution
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Verified Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Build Source Distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: "1.16.0"
          rust-toolchain: stable
          args: --out dist

      - name: Upload Source Distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-github:
    name: Publish Tested GitHub Release
    needs: [prepare, checks, build-wheels, build-linux-arm, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Verified Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Verify or Create Immutable Tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          tag, commit = os.environ["RELEASE_TAG"], os.environ["RELEASE_COMMIT"]
          result = subprocess.check_output(
              ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}", f"refs/tags/{tag}^{{}}"],
              text=True,
          )
          refs = dict(line.split()[::-1] for line in result.splitlines())
          if refs:
              remote_commit = refs.get(f"refs/tags/{tag}^{{}}", refs.get(f"refs/tags/{tag}"))
              if remote_commit != commit:
                  raise SystemExit("Release tag changed during build; refusing publication")
          else:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "tag", "-a", tag, commit, "-m", f"Release {tag}"], check=True)
              subprocess.run(["git", "push", "origin", f"refs/tags/{tag}"], check=True)
          PYTHON

      - name: Download Tested Distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dist-*
          path: dist
          merge-multiple: true

      - name: Check Distribution Count and Record Checksums
        run: |
          python - <<'PYTHON'
          import hashlib
          from pathlib import Path
          files = sorted(Path("dist").glob("*"))
          if len(files) != 31 or sum(p.suffix == ".whl" for p in files) != 30:
              raise SystemExit("Expected 30 wheels and one source distribution")
          if sum(p.name.endswith(".tar.gz") for p in files) != 1:
              raise SystemExit("Expected exactly one source distribution")
          with open("dist/SHA256SUMS", "w") as output:
              for path in files:
                  print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}", file=output)
          PYTHON

      - name: Retain Distribution Checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release and Verified Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Release ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*
